name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit (fails on high or critical)
        run: npm audit --audit-level=high
      - run: npm run build --workspace=@faa/shared
      - name: Type-check
        run: |
          npm run typecheck --workspace=@faa/backend
          npm run typecheck --workspace=@faa/frontend
      - name: Security and accuracy tests
        run: npm test --workspace=@faa/backend
      - name: Production build
        run: |
          npm run build --workspace=@faa/backend
          npm run build --workspace=@faa/frontend

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f backend/Dockerfile -t faa-backend .
      - run: docker build -f frontend/Dockerfile -t faa-frontend .
